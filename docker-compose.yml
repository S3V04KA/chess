
services:
  chess:
    container_name: chess
    image: chess:local
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: 8800
      HOST: 0.0.0.0
      DB_PATH: /app/data/chess.db
      STOCKFISH_PATH: /usr/games/stockfish

      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-}"

    volumes:
      - chess-data:/app/data

    networks:
      - traefik
    
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.chess.rule=Host(`chess.gr34ka.ru`)"
      - "traefik.http.routers.chess.entrypoints=http,https"
      - "traefik.http.routers.chess.tls=true"
      - "traefik.http.routers.chess.tls.certresolver=letsEncrypt"
      - "traefik.http.services.chess.loadbalancer.server.port=8800"
      - "traefik.docker.network=traefik"

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:8800/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  chess-data:

networks:
  traefik:
    external: true